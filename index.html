<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Moses Ngaru</title>
<meta name="description" content="Video editor and videographer portfolio — selected work, showreel, and contact." />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@800&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">

<style>
/* ===========================================================
   TOKENS
   =========================================================== */
:root {
  --bg: #FFFFFF;
  --bg-raised: #F7F7F7;
  --text: #000000;
  --text-muted: rgba(0, 0, 0, 0.6);
  --line: rgba(0, 0, 0, 0.121569);
  --accent: #B3402E;

  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

a { color: inherit; text-decoration: none; }

img, video { display: block; max-width: 100%; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ===========================================================
   SCRUB BAR (scroll progress, styled like a video timeline)
   =========================================================== */
.scrub-bar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 2px;
  background: var(--line);
  z-index: 100;
}
.scrub-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width 0.1s linear;
}

/* ===========================================================
   NAV
   =========================================================== */
.nav {
  box-sizing: border-box;
  position: relative;
  top: auto;
  left: auto;
  width: min(100%, 1440px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 24px 80px;
  margin: 0 auto;
  min-height: 73px;
  background: #FFFFFF;
  border-bottom: 1px solid rgba(0, 0, 0, 0.121569);
  z-index: 20;
  mix-blend-mode: normal;
}

.nav-logo {
  font-family: 'Geist Mono', monospace;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.nav-logo .dot { color: #000000; }

.nav-links {
  display: flex;
  gap: 28px;
  font-family: 'Geist Mono', monospace;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.nav-links a {
  position: relative;
  opacity: 0.8;
  transition: opacity 0.2s var(--ease);
}
.nav-links a:hover { opacity: 1; }
.nav-links a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -4px;
  width: 0%;
  height: 1px;
  background: currentColor;
  transition: width 0.25s var(--ease);
}
.nav-links a:hover::after { width: 100%; }

@media (max-width: 640px) {
  .nav {
    padding: 20px;
    min-height: 64px;
  }

  .nav-links {
    display: none;
  }
}

/* ===========================================================
   HERO
   =========================================================== */
.hero {
  position: relative;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 clamp(20px, 5vw, 64px);
}

.hero-overlay {
  position: absolute;
  top: 28px;
  right: clamp(20px, 5vw, 64px);
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
}
.rec-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.25; }
}
.rec-label { color: var(--accent); letter-spacing: 0.1em; }
.timecode { letter-spacing: 0.05em; min-width: 92px; }

@media (max-width: 640px) {
  .hero-overlay { display: none; }
}

.hero-content {
  max-width: 900px;
  animation: rise 0.9s var(--ease) both;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-muted);
  margin-bottom: 20px;
}

.hero-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(48px, 10vw, 128px);
  line-height: 0.95;
  letter-spacing: -0.02em;
}

.hero-sub {
  margin-top: 28px;
  max-width: 440px;
  font-size: 16px;
  color: var(--text-muted);
}

.hero-cta {
  display: inline-block;
  margin-top: 40px;
  font-family: var(--font-mono);
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--line);
  transition: border-color 0.25s var(--ease), color 0.25s var(--ease);
}
.hero-cta:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.scroll-cue {
  position: absolute;
  bottom: 40px;
  left: clamp(20px, 5vw, 64px);
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
}
.scroll-line {
  width: 1px;
  height: 32px;
  background: var(--line);
  position: relative;
  overflow: hidden;
}
.scroll-line::after {
  content: '';
  position: absolute;
  top: -100%;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--accent);
  animation: scrollDrop 2s ease-in-out infinite;
}
@keyframes scrollDrop {
  0%   { top: -100%; }
  60%  { top: 100%; }
  100% { top: 100%; }
}

/* ===========================================================
   SECTION LABEL (shared)
   =========================================================== */
.section-label {
  font-family: var(--font-mono);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  padding: 0 clamp(20px, 5vw, 64px);
  margin-bottom: 32px;
}

section {
  padding: 120px 0 80px;
  border-top: 1px solid var(--line);
}

/* ===========================================================
   REEL
   =========================================================== */
.reel-frame {
  margin: 0 clamp(20px, 5vw, 64px);
  position: relative;
  background: var(--bg-raised);
  border: 1px solid var(--line);
}

.reel-video {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
}

.reel-frame-label {
  position: absolute;
  bottom: -28px;
  right: 0;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.05em;
}

/* ===========================================================
   MOTION TITLE (Poppins heading + a curved, tapering trail of
   the same word swooping behind it — like a motion-graphics
   title card, not a simple fade)
   =========================================================== */
.motion-title-wrap {
  position: relative;
  display: block;
  padding-bottom: 24px;
}

.echo-title {
  position: relative;
  z-index: 1;
  display: inline-block;
  font-family: 'Poppins', sans-serif;
  font-weight: 800;
  font-size: clamp(40px, 7vw, 84px);
  line-height: 0.98;
  letter-spacing: -0.01em;
  color: #000000;
  background: var(--bg);
  white-space: nowrap;
}

/* ===========================================================
   FEATURE INTRO (used above Work and Photography grids)
   =========================================================== */
.feature-intro {
  padding: 0 clamp(20px, 5vw, 64px);
  margin-bottom: 48px;
  max-width: 640px;
}

.feature-intro-text {
  margin-top: 20px;
  font-size: 16px;
  line-height: 1.7;
  color: var(--text-muted);
  max-width: 480px;
}

.photography .motion-title-wrap {
  margin: 0;
  display: block;
  padding-bottom: 20px;
}

/* ===========================================================
   PROJECT THUMB STACK (peeking tabs behind the video card)
   =========================================================== */
.project-thumb-stack {
  position: relative;
  max-width: 340px;
  margin: 0 auto;
  padding-top: 26px;
}

.project-thumb-tab {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 4px 4px 0 0;
  z-index: 0;
}

.project-thumb-tab-1 {
  top: 0;
  width: 84%;
  height: 36px;
  background: rgba(0, 0, 0, 0.04);
  border: 1px solid var(--line);
  border-bottom: none;
}

.project-thumb-tab-2 {
  top: 13px;
  width: 92%;
  height: 26px;
  background: rgba(179, 64, 46, 0.1);
  border: 1px solid rgba(179, 64, 46, 0.25);
  border-bottom: none;
}

.project-thumb-stack .project-thumb {
  position: relative;
  z-index: 1;
}

/* ===========================================================
   PHOTOGRAPHY
   =========================================================== */
.photography {
  width: min(100%, 1440px);
  margin: 0 auto;
  padding: 100px 80px 120px;
  border-top: 1px solid rgba(0, 0, 0, 0.121569);
}

/* Text on the left, wheel on the right — same idea as the reference layout */
.photography-layout {
  display: grid;
  grid-template-columns: minmax(240px, 380px) 1fr;
  align-items: center;
  gap: 64px;
}

@media (max-width: 900px) {
  .photography-layout {
    grid-template-columns: 1fr;
    gap: 40px;
    text-align: center;
  }
  .photography-intro {
    align-items: center;
  }
  .photography-intro-text {
    max-width: none;
  }
}

.photography-intro {
  display: flex;
  flex-direction: column;
}

.photography-intro .echo-title {
  font-size: clamp(34px, 4vw, 56px);
}

.photography-intro-text {
  margin-top: 4px;
  font-size: 15px;
  line-height: 1.7;
  color: var(--text-muted);
  max-width: 360px;
}

/* Vertical scrolling wheel: same fanned-stack idea as the poster wheel,
   just rotated onto the Y axis so cards scroll up/down instead of side to side.
   Sized to match the poster wheel (320px cards, 600px tall). */
.photo-wheel-wrap {
  position: relative;
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
  padding: 8px 8px 88px;
  isolation: isolate;
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.7s var(--ease), transform 0.7s var(--ease);
}
.photo-wheel-wrap.in-view {
  opacity: 1;
  transform: translateY(0);
}

.photo-wheel {
  position: relative;
  width: 100%;
  height: 600px;
  overflow: hidden;
  z-index: 1;
}

.photo-wheel-track {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  outline: none;
}

.photo-wheel-item {
  --offset: 0;
  position: absolute;
  width: 320px;
  aspect-ratio: 4 / 5;
  border: 1px solid rgba(0, 0, 0, 0.121569);
  background: #F5F5F3;
  padding: 0;
  cursor: pointer;
  overflow: hidden;
  box-shadow: 0 18px 34px rgba(0, 0, 0, 0.16);
  transform-origin: 50% 50%;
  transform:
    translateY(calc(var(--offset) * 160px))
    translateX(calc(min(abs(var(--offset)), 4) * 16px))
    rotate(calc(var(--offset) * -6deg))
    scale(calc(1 - min(abs(var(--offset)), 4) * 0.06));
  opacity: calc(1 - min(abs(var(--offset)), 5) * 0.12);
  transition: transform 0.6s var(--ease), opacity 0.6s var(--ease), border-color 0.3s var(--ease), box-shadow 0.4s var(--ease);
  z-index: calc(20 - abs(var(--offset)));
}

.photo-wheel-item:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.photo-wheel-item.is-active {
  border-color: var(--accent);
  cursor: zoom-in;
  transform: translateY(0) translateX(0) rotate(0deg) scale(1.06);
  box-shadow: 0 28px 48px rgba(0, 0, 0, 0.26);
}

.photo-wheel-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

.photo-wheel-img[src]:not([src=""]) {
  display: block;
}

.photo-wheel-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Geist Mono', monospace;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgba(0, 0, 0, 0.45);
  text-align: center;
  padding: 0 12px;
}

.photo-wheel-img[src]:not([src=""]) ~ .photo-wheel-placeholder {
  display: none;
}

.photo-wheel-title {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 10px 12px;
  font-family: 'Geist Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #000000;
  background: linear-gradient(to top, rgba(255, 255, 255, 0.94), rgba(255, 255, 255, 0));
  opacity: 0;
  transition: opacity 0.3s var(--ease);
}

.photo-wheel-item.is-active .photo-wheel-title {
  opacity: 1;
}

/* Advance arrow — sits below the wheel, pointing down */
.photo-wheel-arrow {
  position: absolute;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 1px solid rgba(0, 0, 0, 0.2);
  background: #FFFFFF;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 5;
  color: #000000;
  transition: border-color 0.25s var(--ease), background 0.25s var(--ease), color 0.25s var(--ease), transform 0.25s var(--ease);
}
.photo-wheel-arrow svg { width: 20px; height: 20px; transform: rotate(90deg); }
.photo-wheel-arrow:hover,
.photo-wheel-arrow:focus-visible {
  border-color: var(--accent);
  background: var(--accent);
  color: #FFFFFF;
  transform: translateX(-50%) scale(1.06);
}

.project-grid {
  padding: 0 clamp(20px, 5vw, 64px);
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 48px 32px;
}

@media (max-width: 800px) {
  .project-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 520px) {
  .project-grid { grid-template-columns: 1fr; }
}

.project-card {
  cursor: pointer;
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.7s var(--ease), transform 0.7s var(--ease);
}
.project-card.in-view {
  opacity: 1;
  transform: translateY(0);
}

.project-thumb {
  position: relative;
  aspect-ratio: 9 / 16;
  max-width: 340px;
  margin: 0 auto;
  background: var(--bg-raised);
  border: 1px solid var(--line);
  overflow: hidden;
}
.project-thumb video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s var(--ease);
}
.project-card:hover .project-thumb video {
  transform: scale(1.03);
}

.project-scrub {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 2px;
  background: rgba(237, 236, 230, 0.15);
}
.project-scrub-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width 0.2s linear;
}

.project-meta {
  margin-top: 16px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.project-meta h3 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 20px;
}
.project-tags {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
}

/* ===========================================================
   POSTERS
   =========================================================== */
.posters {
  width: min(100%, 1440px);
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding: 100px 80px 120px;
  gap: 56px;
  border-top: 1px solid rgba(0, 0, 0, 0.121569);
}

.posters .section-label,
.testimonials .section-label {
  padding: 0;
  margin: 0;
}

.section-intro {
  font-family: 'Geist Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: rgba(0, 0, 0, 0.6);
}

/* Wrap: holds the wheel, its decorative rings, and the preview arrow */
.poster-wheel-wrap {
  position: relative;
  width: 100%;
  padding: 8px 88px 8px 8px;
  isolation: isolate;
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.7s var(--ease), transform 0.7s var(--ease);
}
.poster-wheel-wrap.in-view {
  opacity: 1;
  transform: translateY(0);
}

/* Decorative rings, echoing the hero banner's geometric circles */
.poster-wheel-accent-circle {
  position: absolute;
  border: 1px solid rgba(0, 0, 0, 0.12);
  border-radius: 50%;
  z-index: 0;
  pointer-events: none;
}
.poster-wheel-accent-circle {
  width: 380px;
  height: 380px;
  right: -140px;
  top: -90px;
  opacity: 0.5;
}
.poster-wheel-accent-circle-2 {
  width: 230px;
  height: 230px;
  left: 60px;
  bottom: -70px;
  opacity: 0.3;
}

/* The wheel: a wide fanned spread of cards, front one raised and enlarged */
.poster-wheel {
  position: relative;
  width: 100%;
  height: 600px;
  overflow: hidden;
  z-index: 1;
}

.poster-wheel-track {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 44px;
  outline: none;
}

.poster-wheel-item {
  --offset: 0;
  position: absolute;
  bottom: 44px;
  width: 320px;
  aspect-ratio: 3 / 4;
  border: 1px solid rgba(0, 0, 0, 0.121569);
  background: #F5F5F3;
  padding: 0;
  cursor: pointer;
  overflow: hidden;
  box-shadow: 0 18px 34px rgba(0, 0, 0, 0.16);
  transform-origin: 50% 100%;
  transform:
    translateX(calc(var(--offset) * 176px))
    translateY(calc(min(abs(var(--offset)), 4) * 18px))
    rotate(calc(var(--offset) * 9deg))
    scale(calc(1 - min(abs(var(--offset)), 4) * 0.05));
  opacity: calc(1 - min(abs(var(--offset)), 5) * 0.08);
  transition: transform 0.6s var(--ease), opacity 0.6s var(--ease), border-color 0.3s var(--ease), box-shadow 0.4s var(--ease);
  z-index: calc(20 - abs(var(--offset)));
}

.poster-wheel-item:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.poster-wheel-item.is-active {
  border-color: var(--accent);
  cursor: zoom-in;
  transform: translateX(0) translateY(-32px) rotate(0deg) scale(1.06);
  box-shadow: 0 28px 48px rgba(0, 0, 0, 0.26);
}

.poster-wheel-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

/* Shows automatically once the img has a real src filled in — no extra class needed */
.poster-wheel-img[src]:not([src=""]) {
  display: block;
}

.poster-wheel-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Geist Mono', monospace;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgba(0, 0, 0, 0.45);
  text-align: center;
  padding: 0 12px;
}

.poster-wheel-img[src]:not([src=""]) ~ .poster-wheel-placeholder {
  display: none;
}

.poster-wheel-title {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 10px 12px;
  font-family: 'Geist Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #000000;
  background: linear-gradient(to top, rgba(255, 255, 255, 0.94), rgba(255, 255, 255, 0));
  opacity: 0;
  transition: opacity 0.3s var(--ease);
}

.poster-wheel-item.is-active .poster-wheel-title {
  opacity: 1;
}

/* Preview arrow — sits at the far right of the wheel */
.poster-wheel-arrow {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 1px solid rgba(0, 0, 0, 0.2);
  background: #FFFFFF;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 5;
  color: #000000;
  transition: border-color 0.25s var(--ease), background 0.25s var(--ease), color 0.25s var(--ease), transform 0.25s var(--ease);
}
.poster-wheel-arrow svg { width: 20px; height: 20px; }
.poster-wheel-arrow:hover,
.poster-wheel-arrow:focus-visible {
  border-color: var(--accent);
  background: var(--accent);
  color: #FFFFFF;
  transform: translateY(-50%) scale(1.06);
}

/* Full preview lightbox */
.poster-lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.92);
  display: flex;
  align-ite
